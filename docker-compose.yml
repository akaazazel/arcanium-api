volumes:
    postgres-data:

services:
    fastapi:
        build: .
        command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000" ]
        env_file:
            - .env
        ports:
            - 8000:8000
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:14.23-alpine3.23
        env_file:
            - .env
        ports:
            - 5431:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
